<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>Picly</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body>


<!-- =====================================================
     AUTH SCREEN
===================================================== -->

<div
  id="authScreen"
  class="auth-screen"
>

  <div class="auth-card">

    <div class="auth-logo">
      Picly
    </div>

    <p class="tagline">
      Share your world ✨
    </p>


    <!-- SIGN UP -->

    <div id="signupBox">

      <h2>
        Create account
      </h2>

      <input
        id="signupUsername"
        type="text"
        placeholder="Username"
        autocomplete="username"
      >

      <input
        id="signupEmail"
        type="email"
        placeholder="Email"
        autocomplete="email"
      >

      <input
        id="signupPassword"
        type="password"
        placeholder="Password"
        autocomplete="new-password"
      >

      <button
        class="gradient-btn"
        type="button"
        onclick="signup()"
      >
        Create Account
      </button>

      <p>
        Already have an account?

        <span
          onclick="showLogin()"
        >
          Log in
        </span>
      </p>

    </div>


    <!-- LOGIN -->

    <div
      id="loginBox"
      class="hidden"
    >

      <h2>
        Welcome back 👋
      </h2>

      <input
        id="loginUsername"
        type="text"
        placeholder="Username"
        autocomplete="username"
      >

      <input
        id="loginPassword"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
      >

      <button
        class="gradient-btn"
        type="button"
        onclick="login()"
      >
        Login
      </button>

      <p>
        New to Picly?

        <span
          onclick="showSignup()"
        >
          Create account
        </span>
      </p>

    </div>

  </div>

</div>



<!-- =====================================================
     MAIN APP
===================================================== -->

<div
  id="app"
  class="hidden"
>


  <!-- TOP BAR -->

  <header class="topbar">

    <div class="brand">
      Picly
    </div>


    <div class="search">

      🔍

      <input
        id="search"
        type="search"
        placeholder="Search users..."
        autocomplete="off"
      >

    </div>


    <button
      id="profileButton"
      type="button"
      onclick="openProfile()"
    >
      👤
    </button>

  </header>



  <main>


    <!-- STORIES -->

    <section class="stories-card">

      <div
        id="stories"
        class="stories"
      ></div>

    </section>


    <!-- USER SEARCH -->

    <div
      id="userSearchResults"
      class="user-search-results"
    ></div>


    <!-- FEED -->

    <div id="feed"></div>

  </main>



  <!-- BOTTOM NAV -->

  <nav class="bottom-nav">

    <button type="button">
      🏠
      <small>Home</small>
    </button>


    <button
      type="button"
      onclick="document.getElementById('search').focus()"
    >
      🔍
      <small>Search</small>
    </button>


    <button
      class="post-button"
      type="button"
      onclick="openPost()"
    >
      ＋
    </button>


    <button type="button">
      ❤️
      <small>Activity</small>
    </button>


    <button
      type="button"
      onclick="openProfile()"
    >
      👤
      <small>Profile</small>
    </button>

  </nav>



  <!-- =====================================================
       CREATE POST MODAL
  ===================================================== -->

  <div
    id="postModal"
    class="modal hidden"
  >

    <div class="modal-card">

      <h2>
        Create Post
      </h2>


      <input
        id="postImage"
        type="file"
        accept="image/*"
      >


      <textarea
        id="caption"
        placeholder="Write a caption..."
      ></textarea>


      <button
        class="gradient-btn"
        type="button"
        onclick="publishPost()"
      >
        Share Post
      </button>


      <button
        class="close"
        type="button"
        onclick="closePost()"
      >
        Cancel
      </button>

    </div>

  </div>



  <!-- =====================================================
       PROFILE MODAL
  ===================================================== -->

  <div
    id="profileModal"
    class="modal hidden"
  >

    <div class="modal-card profile-card">


      <button
        class="profile-close"
        type="button"
        onclick="closeProfile()"
      >
        ← Back
      </button>


      <div
        id="profileAvatar"
        class="big-avatar"
      >
        👤
      </div>


      <h2 id="profileName"></h2>


      <p id="profileEmail"></p>


      <p id="profileBio"></p>


      <div class="stats">


        <div>

          <b id="postCount">
            0
          </b>

          <span>
            Posts
          </span>

        </div>


        <div>

          <b id="followerCount">
            0
          </b>

          <span>
            Followers
          </span>

        </div>


        <div>

          <b id="followingCount">
            0
          </b>

          <span>
            Following
          </span>

        </div>


      </div>


      <button
        id="followButton"
        class="gradient-btn hidden"
        type="button"
        onclick="toggleFollow()"
      >
        Follow
      </button>


      <button
        id="logoutButton"
        class="gradient-btn"
        type="button"
        onclick="logout()"
      >
        Logout
      </button>

    </div>

  </div>

</div>



<!-- =====================================================
     SUPABASE
===================================================== -->

<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<!-- =====================================================
     PICLY APP
===================================================== -->

<script src="app.js"></script>


</body>
  </html>
