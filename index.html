<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Picly — Social App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="logo">Picly</div>
    <input id="search" type="search" placeholder="Search">
    <button id="profileBtn">Profile</button>
  </header>

  <main>
    <section class="stories" id="stories"></section>
    <section id="feed"></section>
  </main>

  <nav class="bottom-nav">
    <button>⌂<span>Home</span></button>
    <button>⌕<span>Search</span></button>
    <button id="newPostBtn">＋<span>Post</span></button>
    <button>♡<span>Activity</span></button>
    <button id="navProfile">◯<span>Profile</span></button>
  </nav>

  <div class="modal hidden" id="postModal">
    <div class="modal-card">
      <h2>Create post</h2>
      <input id="imageUrl" placeholder="Image URL">
      <textarea id="caption" placeholder="Write a caption..."></textarea>
      <div class="actions">
        <button id="cancelPost">Cancel</button>
        <button class="primary" id="publishPost">Publish</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
