<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Picly</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="authScreen" class="auth-screen">

  <div class="auth-card">

    <div class="auth-logo">Picly</div>

    <p class="tagline">Share your world ✨</p>

    <div id="signupBox">

      <h2>Create account</h2>

      <input id="signupUsername"
             placeholder="Username">

      <input id="signupEmail"
             type="email"
             placeholder="Email">

      <input id="signupPassword"
             type="password"
             placeholder="Password">

      <button class="gradient-btn" onclick="signup()">
        Create Account
      </button>

      <p>
        Already have an account?
        <span onclick="showLogin()">Log in</span>
      </p>

    </div>


    <div id="loginBox" class="hidden">

      <h2>Welcome back 👋</h2>

      <input id="loginUsername"
             placeholder="Username">

      <input id="loginPassword"
             type="password"
             placeholder="Password">

      <button class="gradient-btn" onclick="login()">
        Login
      </button>

      <p>
        New to Picly?
        <span onclick="showSignup()">Create account</span>
      </p>

    </div>

  </div>

</div>


<div id="app" class="hidden">

<header class="topbar">

  <div class="brand">Picly</div>

  <div class="search">
    🔍
    <input id="search"
           placeholder="Search">
  </div>

  <button id="profileButton"
          onclick="openProfile()">
    👤
  </button>

</header>


<main>

<section class="stories-card">

  <div class="stories" id="stories"></div>

</section>

<div id="feed"></div>

</main>


<nav class="bottom-nav">

<button>
  🏠
  <small>Home</small>
</button>

<button>
  🔍
  <small>Search</small>
</button>

<button class="post-button"
        onclick="openPost()">
  ＋
</button>

<button>
  ❤️
  <small>Activity</small>
</button>

<button onclick="openProfile()">
  👤
  <small>Profile</small>
</button>

</nav>


<div id="postModal"
     class="modal hidden">

<div class="modal-card">

<h2>Create Post</h2>

<input id="imageUrl"
       placeholder="Image URL">

<textarea id="caption"
          placeholder="Write a caption..."></textarea>

<button class="gradient-btn"
        onclick="publishPost()">
Share Post
</button>

<button class="close"
        onclick="closePost()">
Cancel
</button>

</div>

</div>


<div id="profileModal" class="modal hidden">

  <div class="modal-card profile-card">

    <button class="profile-close" onclick="closeProfile()">
      ← Back
    </button>

    <div id="profileAvatar" class="big-avatar">
      👤
    </div>

    <h2 id="profileName"></h2>

    <p id="profileEmail"></p>

    <div class="stats">

      <div>
        <b id="postCount">0</b>
        <span>Posts</span>
      </div>

      <div>
        <b id="followerCount">0</b>
        <span>Followers</span>
      </div>

      <div>
        <b id="followingCount">0</b>
        <span>Following</span>
      </div>

    </div>

    <button class="gradient-btn" onclick="logout()">
      Logout
    </button>

  </div>

</div>

<h2 id="profileName"></h2>

<p id="profileEmail"></p>

<div class="stats">

<div>
<b id="postCount">0</b>
Posts
</div>

<div>
<b>0</b>
Followers
</div>

<div>
<b>0</b>
Following
</div>

</div>

<button class="gradient-btn"
        onclick="logout()">
Logout
</button>

</div>

</div>

</div>

<script src="app.js"></script>

</body>
</html>
