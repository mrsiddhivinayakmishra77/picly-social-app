<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>Picly</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body>


<!-- =========================
     AUTH SCREEN
========================= -->

<div id="authScreen" class="auth-screen">

  <div class="auth-card">

    <div class="auth-logo">
      Picly
    </div>

    <p class="tagline">
      Share your world ✨
    </p>


    <!-- SIGNUP -->

    <div id="signupBox">

      <h2>Create account</h2>

      <input
        id="signupUsername"
        placeholder="Username"
      >

      <input
        id="signupEmail"
        type="email"
        placeholder="Email"
      >

      <input
        id="signupPassword"
        type="password"
        placeholder="Password"
      >

      <button
        class="gradient-btn"
        onclick="signup()"
      >
        Create Account
      </button>

      <p>
        Already have an account?
        <span onclick="showLogin()">
          Log in
        </span>
      </p>

    </div>


    <!-- LOGIN -->

    <div
      id="loginBox"
      class="hidden"
    >

      <h2>
        Welcome back 👋
      </h2>

      <input
        id="loginUsername"
        placeholder="Username"
      >

      <input
        id="loginPassword"
        type="password"
        placeholder="Password"
      >

      <button
        class="gradient-btn"
        onclick="login()"
      >
        Login
      </button>

      <p>
        New to Picly?
        <span onclick="showSignup()">
          Create account
        </span>
      </p>

    </div>

  </div>

</div>



<!-- =========================
     MAIN APP
========================= -->

<div
  id="app"
  class="hidden"
>

  <header class="topbar">

    <div class="brand">
      Picly
    </div>


    <!-- SEARCH -->

    <div class="search">

      🔍

      <input
        id="search"
        placeholder="Search users or posts"
      >

    </div>


    <!-- MY PROFILE -->

    <button
      id="profileButton"
      onclick="openProfile()"
    >
      👤
    </button>

  </header>



  <main>

    <!-- STORIES -->

    <section class="stories-card">

      <div
        class="stories"
        id="stories"
      ></div>

    </section>


    <!-- USER SEARCH RESULTS -->

    <div
      id="userSearchResults"
      class="user-search-results"
    ></div>


    <!-- POSTS -->

    <div id="feed"></div>

  </main>



  <!-- =========================
       BOTTOM NAV
  ========================= -->

  <nav class="bottom-nav">

    <button>
      🏠
      <small>Home</small>
    </button>

    <button>
      🔍
      <small>Search</small>
    </button>

    <button
      class="post-button"
      onclick="openPost()"
    >
      ＋
    </button>

    <button>
      ❤️
      <small>Activity</small>
    </button>

    <button
      onclick="openProfile()"
    >
      👤
      <small>Profile</small>
    </button>

  </nav>



  <!-- =========================
       CREATE POST MODAL
  ========================= -->

  <div
    id="postModal"
    class="modal hidden"
  >

    <div class="modal-card">

      <h2>
        Create Post
      </h2>

      <input
        id="imageUrl"
        placeholder="Image URL"
      >

      <textarea
        id="caption"
        placeholder="Write a caption..."
      ></textarea>

      <button
        class="gradient-btn"
        onclick="publishPost()"
      >
        Share Post
      </button>

      <button
        class="close"
        onclick="closePost()"
      >
        Cancel
      </button>

    </div>

  </div>



  <!-- =========================
       PROFILE MODAL
  ========================= -->

  <div
    id="profileModal"
    class="modal hidden"
  >

    <div
      class="modal-card profile-card"
    >

      <button
        class="profile-close"
        onclick="closeProfile()"
      >
        ← Back
      </button>


      <!-- PROFILE AVATAR -->

      <div
        id="profileAvatar"
        class="big-avatar"
      >
        👤
      </div>


      <!-- NAME -->

      <h2 id="profileName"></h2>


      <!-- EMAIL -->

      <p id="profileEmail"></p>


      <!-- BIO -->

      <p id="profileBio"></p>


      <!-- STATS -->

      <div class="stats">

        <div>

          <b id="postCount">
            0
          </b>

          <span>
            Posts
          </span>

        </div>


        <div>

          <b id="followerCount">
            0
          </b>

          <span>
            Followers
          </span>

        </div>


        <div>

          <b id="followingCount">
            0
          </b>

          <span>
            Following
          </span>

        </div>

      </div>


      <!-- FOLLOW BUTTON -->

      <button
        id="followButton"
        class="gradient-btn hidden"
        onclick="toggleFollow()"
      >
        Follow
      </button>


      <!-- LOGOUT -->

      <button
        id="logoutButton"
        class="gradient-btn"
        onclick="logout()"
      >
        Logout
      </button>

    </div>

  </div>


</div>



<!-- =========================
     SUPABASE
========================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<!-- =========================
     PICLY APP
========================= -->

<script src="app.js"></script>


</body>
</html>
